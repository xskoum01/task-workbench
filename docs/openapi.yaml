openapi: 3.1.0
info:
  title: Task Workbench Local API
  version: 1.0.0
  description: >
    Provider-neutral task, obligation, context, and history API. The API records
    work but never executes it or orchestrates AI agents.
servers:
  - url: http://127.0.0.1:38473/api/v1
security:
  - bridgeToken: []
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: Canonical runtime health }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /capabilities:
    get:
      operationId: capabilities
      responses:
        "200": { description: Capabilities actually exposed by this runtime }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /work-items:
    get:
      operationId: listWorkItems
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: owner
          schema: { type: string }
        - in: query
          name: area
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: planningBucket
          schema: { type: string }
        - in: query
          name: dueBefore
          schema: { type: string, format: date-time }
        - in: query
          name: dueAfter
          schema: { type: string, format: date-time }
        - in: query
          name: updatedAfter
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Canonical work-item page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemListEnvelope"
    post:
      operationId: createWorkItem
      description: >
        Creates a canonical WorkItem. Accepts either a bare WorkItem body, or
        `{ item, idempotencyKey }` — a repeated call with the same
        `idempotencyKey` returns the original record instead of creating a
        duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ./work-item.schema.json
                - type: object
                  required: [item]
                  properties:
                    item: { $ref: ./work-item.schema.json }
                    idempotencyKey: { type: string }
      responses:
        "200": { description: Created work item }
        "400": { $ref: "#/components/responses/Error" }
  /work-items/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: getWorkItem
      responses:
        "200": { description: Canonical work item }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkItem
      description: Replace the complete canonical WorkItem with optimistic revision control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, expectedRevision]
              properties:
                item: { $ref: ./work-item.schema.json }
                expectedRevision: { type: integer, minimum: 1 }
                actorType: { enum: [user, system, integration] }
                actorName: { type: string }
      responses:
        "200": { description: Updated work item }
        "409": { $ref: "#/components/responses/Error" }
  /work-items/{id}/patch:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: patchWorkItem
      description: >
        Patch whitelisted canonical WorkItem fields with optimistic revision
        control. This is the preferred small-edit endpoint for trusted local
        integrations such as Jarvis because callers do not need to send the
        whole WorkItem record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch, expectedRevision]
              properties:
                patch: { $ref: "#/components/schemas/WorkItemPatch" }
                expectedRevision: { type: integer, minimum: 1 }
                actorName: { type: string }
      responses:
        "200": { description: Patched work item }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /task-records/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: getTaskRecord
      description: >
        Full trusted-local Task Workbench record for application integrations
        such as Jarvis. Includes the canonical provider-neutral work item, the
        UI-compatible task JSON, and derived workflow/status/link fields. This
        endpoint is intentionally more complete than `/work-items/{id}` and is
        available only to clients with the local bridge token.
      responses:
        "200":
          description: Full Task Workbench task record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecordDetailEnvelope"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: transitionWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedRevision]
              properties:
                status:
                  enum: [planned, ready, in_progress, waiting, blocked, review, completed, cancelled]
                reason: { type: string }
                expectedRevision: { type: integer, minimum: 1 }
                actorName: { type: string }
      responses:
        "200": { description: Transitioned work item }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /work-items/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: appendWorkItemNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, expectedRevision]
              properties:
                text: { type: string, minLength: 1 }
                expectedRevision: { type: integer, minimum: 1 }
                actorName: { type: string }
      responses:
        "200": { description: Work item with appended context }
        "409": { $ref: "#/components/responses/Error" }
  /work-items/changes:
    get:
      operationId: listWorkItemChanges
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: Ordered change records and next cursor }
  /planning/today:
    get:
      operationId: getPlanningToday
      description: >
        Live Now/Today planning read model. Membership in `now`/`today` is
        an exact match against each work item's explicitly stored
        `planningBucket` — it is never inferred from `dueAt`, `status`, or
        the current date/timezone. The `timezone` parameter is echoed back
        on the response only; it does not affect which items are returned.
        The UI's Planning view (src/lib/planning.ts `effectiveBucket`)
        applies this same exact-match rule against the same stored field,
        so this endpoint and the UI can never disagree about Now/Today
        membership.
      parameters:
        - in: query
          name: timezone
          schema: { type: string, default: UTC }
      responses:
        "200":
          description: Live Now and Today planning read model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningTodayEnvelope"
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /planning/daily-queue:
    get:
      operationId: getDailyQueue
      description: >
        The Daily Queue is a distinct concept from both `status` and
        `planningBucket`: it is the explicit, user-chosen order to work
        through items on one calendar date, never AI-ranked or inferred from
        priority/due date/status. A date with no queue yet is not an error —
        it returns `revision: 0` with an empty `entries` array (a virtual
        empty queue); the first mutation for that date is the one whose
        `expectedRevision` is `0`. When `date` is omitted, it defaults to the
        app's local calendar today — the same "today" `src/lib/dates.ts`'s
        `localTodayStr()` computes for the UI, so REST/MCP and the UI can
        never disagree about what day "today" means. Reading local today
        initializes that date once from the latest earlier queue, preserving
        unfinished entries in order while leaving completed/cancelled work and
        completed notes in the historical day.
      parameters:
        - in: query
          name: date
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          description: Local calendar date, YYYY-MM-DD. Defaults to local today.
      responses:
        "200":
          description: The daily queue for the resolved date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQueueEnvelope"
        "400": { $ref: "#/components/responses/Error" }
    patch:
      operationId: replaceDailyQueue
      description: >
        Atomically sets the complete ordered queue for `date` to exactly
        `workItemIds`, in that order. Rejects a duplicate id, an archived
        work item, or an id that does not exist — the whole call fails and
        nothing is partially applied. An id that was already queued for that
        date keeps its original `addedAt`; a newly-added id is stamped with
        the request time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, workItemIds, expectedRevision]
              properties:
                date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                workItemIds:
                  type: array
                  items: { type: string, minLength: 1 }
                expectedRevision:
                  type: integer
                  minimum: 0
                  description: Use 0 for a date that has no queue yet.
      responses:
        "200": { description: The updated daily queue }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /planning/daily-queue/items:
    post:
      operationId: addToDailyQueue
      description: >
        Adds one work item to the queue for `date`. `position` is 1-based;
        omitted or out-of-range values append to the end. Rejects if the
        work item is already queued for that date, archived, or does not
        exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, workItemId, expectedRevision]
              properties:
                date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                workItemId: { type: string, minLength: 1 }
                position: { type: integer, minimum: 1 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        "200": { description: The updated daily queue }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /planning/daily-queue/notes:
    post:
      operationId: addNoteToDailyQueue
      description: Adds a lightweight queue-local text reminder without creating a WorkItem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, text, expectedRevision]
              properties:
                date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                text: { type: string, minLength: 1, maxLength: 500 }
                position: { type: integer, minimum: 1 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        "200": { description: The updated daily queue }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /planning/daily-queue/items/{workItemId}/move:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: moveDailyQueueItem
      description: >
        Moves a work item already in the queue for `date` to 1-based
        `position`, clamped to the valid range. Rejects if the work item is
        not currently in that day's queue. Never changes `status` or
        `planningBucket`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, position, expectedRevision]
              properties:
                date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                position: { type: integer, minimum: 1 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        "200": { description: The updated daily queue }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /planning/daily-queue/items/{workItemId}/remove:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: removeFromDailyQueue
      description: >
        Removes a work item from the queue for `date`. Does not change the
        work item's `status`, `planningBucket`, or any other field — it only
        leaves today's execution order. Rejects if the work item is not
        currently in that day's queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, expectedRevision]
              properties:
                date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        "200": { description: The updated daily queue }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bridgeToken:
      type: apiKey
      in: header
      name: X-Task-Workbench-Bridge-Token
  parameters:
    WorkItemId:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Structured application error
      content:
        application/json:
          schema:
            type: object
            required: [ok, apiVersion, error]
            properties:
              ok: { const: false }
              apiVersion: { const: "1" }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  currentRevision: { type: integer }
  schemas:
    # Canonical success envelope every /api/v1/* route wraps its payload in.
    # `result` carries the endpoint-specific body (see PlanningTodayResult /
    # WorkItemListResult below) — it is one level below the top-level `ok`/
    # `apiVersion`/`correlationId` fields, not merged into them.
    CanonicalEnvelope:
      type: object
      required: [ok, apiVersion, correlationId, result]
      properties:
        ok: { const: true }
        apiVersion: { const: "1" }
        correlationId: { type: string }
        result: {}
    WorkItemSummary:
      type: object
      description: >
        The projected list-item shape used by /work-items and
        /planning/today (built by canonical_summary in lib.rs). This is
        intentionally a smaller projection than the full WorkItem detail
        returned by GET /work-items/{id} — see work-item.schema.json for
        that shape.
      required:
        - id
        - kind
        - title
        - status
        - priority
        - source
        - updatedAt
        - revision
        - archived
      properties:
        id: { type: string }
        kind: { enum: [task, obligation] }
        title: { type: string }
        status:
          enum: [planned, ready, in_progress, waiting, blocked, review, completed, cancelled]
        priority: { enum: [low, normal, high, critical] }
        planningBucket:
          type: [string, "null"]
          description: Explicitly stored bucket assignment; null when never set. Never inferred.
        owner:
          type: [object, "null"]
          properties:
            id: { type: [string, "null"] }
            displayName: { type: string }
        area:
          type: [object, "null"]
          description: >
            Provider-neutral project/area identity. `id` is the stable area
            identifier and `name` is its current human-readable display label.
          properties:
            id: { type: string }
            name: { type: string }
        dueAt: { type: [string, "null"], format: date-time }
        estimateMinutes: { type: [integer, "null"] }
        source: { type: string }
        updatedAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
        archived: { type: boolean }
    WorkItemListResult:
      type: object
      required: [apiVersion, generatedAt, snapshotRevision, items, nextCursor]
      properties:
        apiVersion: { const: "1" }
        generatedAt: { type: string, format: date-time }
        snapshotRevision: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkItemSummary" }
        nextCursor: { type: [string, "null"] }
    WorkItemListEnvelope:
      allOf:
        - $ref: "#/components/schemas/CanonicalEnvelope"
        - type: object
          properties:
            result: { $ref: "#/components/schemas/WorkItemListResult" }
    TaskRecordDetail:
      type: object
      required: [apiVersion, canonical, legacyTask, derived]
      properties:
        apiVersion: { const: "1" }
        canonical:
          description: Full canonical WorkItem detail; see work-item.schema.json.
          $ref: ./work-item.schema.json
        legacyTask:
          type: object
          additionalProperties: true
          description: Current UI-compatible task JSON, including legacy/UI-only fields when present.
        derived:
          type: object
          required: [workflowType, recordStatus, recordStatusLabel, recordStatusOptions, planningBucket, notesText, externalLinks]
          properties:
            workflowType: { enum: [developer, general] }
            recordStatus: { type: string }
            recordStatusLabel: { type: string }
            recordStatusOptions:
              type: array
              items:
                type: object
                required: [value, label]
                properties:
                  value: { type: string }
                  label: { type: string }
            planningBucket:
              type: [string, "null"]
            notesText: { type: string }
            externalLinks:
              type: array
              items: { type: object, additionalProperties: true }
    WorkItemPatch:
      type: object
      additionalProperties: false
      description: Whitelisted partial update for a canonical WorkItem.
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        expectedOutcome: { type: [string, "null"] }
        priority: { enum: [low, normal, high, critical] }
        owner: { oneOf: [{ $ref: ./work-item.schema.json#/properties/owner }, { type: "null" }] }
        accountableTo: { oneOf: [{ $ref: ./work-item.schema.json#/properties/accountableTo }, { type: "null" }] }
        areaId: { type: [string, "null"] }
        parentId: { type: [string, "null"] }
        startAt: { type: [string, "null"] }
        dueAt: { type: [string, "null"] }
        nextReviewAt: { type: [string, "null"] }
        blockerReason: { type: [string, "null"] }
        source: { type: string, minLength: 1 }
        sourceUrl: { type: [string, "null"] }
        planningBucket: { type: [string, "null"] }
        estimateMinutes: { type: [integer, "null"], minimum: 1, maximum: 60000 }
        externalReferences:
          type: array
          items: { $ref: ./work-item.schema.json#/properties/externalReferences/items }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Shallow metadata merge; null values remove individual keys.
        budgetHours: { type: [number, "null"], minimum: 0, maximum: 1000 }
        budgetNote: { type: [string, "null"] }
    TaskRecordDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/CanonicalEnvelope"
        - type: object
          properties:
            result: { $ref: "#/components/schemas/TaskRecordDetail" }
    PlanningSections:
      type: object
      required: [now, today]
      properties:
        now:
          type: array
          items: { $ref: "#/components/schemas/WorkItemSummary" }
        today:
          type: array
          items: { $ref: "#/components/schemas/WorkItemSummary" }
    PlanningTodayResult:
      type: object
      required: [apiVersion, generatedAt, sourceRevision, timezone, sections]
      properties:
        apiVersion: { const: "1" }
        generatedAt: { type: string, format: date-time }
        sourceRevision: { type: integer }
        timezone:
          type: string
          description: Echoed back from the request; does not affect bucket membership.
        sections: { $ref: "#/components/schemas/PlanningSections" }
    PlanningTodayEnvelope:
      allOf:
        - $ref: "#/components/schemas/CanonicalEnvelope"
        - type: object
          properties:
            result: { $ref: "#/components/schemas/PlanningTodayResult" }
    DailyQueueEntryProjection:
      type: object
      description: >
        One ordered queue entry. Work-item entries include the current WorkItem
        summary; note entries are queue-local text and do not create WorkItems.
      required: [id, kind, position, addedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [work_item, note] }
        position: { type: integer, minimum: 1 }
        workItem: { $ref: "#/components/schemas/WorkItemSummary" }
        text: { type: string }
        addedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    DailyQueueResult:
      type: object
      required: [apiVersion, date, revision, generatedAt, entries]
      properties:
        apiVersion: { const: "1" }
        date: { type: string, description: "YYYY-MM-DD, the resolved date this queue is for." }
        revision:
          type: integer
          description: >
            0 means this date has no queue yet (a virtual empty queue) — the
            first mutation for that date must pass expectedRevision=0.
        generatedAt: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DailyQueueEntryProjection" }
    DailyQueueEnvelope:
      allOf:
        - $ref: "#/components/schemas/CanonicalEnvelope"
        - type: object
          properties:
            result: { $ref: "#/components/schemas/DailyQueueResult" }
